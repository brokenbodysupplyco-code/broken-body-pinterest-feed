name: Update Pinterest product feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate product feed
        env:
          FOURTHWALL_API_USER: ${{ secrets.FOURTHWALL_API_USER }}
          FOURTHWALL_API_PASSWORD: ${{ secrets.FOURTHWALL_API_PASSWORD }}
          FOURTHWALL_STORE_URL: https://brokenbodysupplyco.com
        run: python feed.py
      - name: Commit updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/products.csv
          git diff --cached --quiet || (git commit -m 'Refresh Pinterest catalog' && git push)
